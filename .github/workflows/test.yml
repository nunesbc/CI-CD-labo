name: Oefening2

on: 
  push:
    branches:
    - main
jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: get code
      uses: actions/checkout@v4
    - name: Node.js configuration
      uses: actions/setup-node@24
      with:
        node-version: '24'
        cache: 'npm'
    - name: install dependencies
      run: npm install

    - name: run tests
      run: npm test --if-present