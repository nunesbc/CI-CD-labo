name: Oefening2

on: 
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    
    steps:
    - name: get code
      uses: actions/checkout@v7
      
    - name: Node.js configuration
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: run tests
      run: npm test